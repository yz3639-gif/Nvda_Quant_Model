historical_sample_start: 1970-01-01

macro_event_policy:
  require_true_release_calendar: true
  no_surprise_importance_cap: 2
  no_surprise_weight_cap: 0.05
  categories: [CPI, PPI, RETAIL_SALES, INITIAL_JOBLESS_CLAIMS, INDUSTRIAL_PRODUCTION, EMPIRE_MANUFACTURING]

options:
  ticker: SPY
  source: yfinance
  expiries_days: [7, 14, 30, 90, 180, 365]

sentiment:
  manual_overrides_path: manual_sentiment.yaml
  require_core_sentiment: false
  min_dims_required: 3
  nearest_fraction: 0.5
  macro_only_features:
    - VIX
    - VIX_term_level
    - MOVE
    - HY_OAS
    - IG_OAS
    - UST2Y_YIELD
    - UST10Y_YIELD
    - UST30Y_YIELD
    - curve_2s10s
    - curve_5s30s
    - T10YIE
    - T5YIE
    - DFII10
    - UNRATE
    - CPI_YOY
    - FEDFUNDS
    - WALCL_YOY
    - NFCI
    - USEPUINDXD
    - AAII_bull_bear_spread
    - CFTC_emini_spx_net_percentile
    - CBOE_equity_pc_10dma
    - NAAIM_exposure
    - FINRA_margin_debt_yoy
    - ICI_4w_equity_flow_b
  momentum_features:
    - SPY_5d_return
    - SPY_20d_return
    - SPY_distance_200dma

weight_formula:
  small_sample_penalty:
    n_lt_10: 0.3
    n_lt_30: 0.6
  significance_metric: p_value_holm
  economic_signal_cap: 0.05
  macro_no_surprise_weight_cap: 0.05

robustness_tests: true
include_alt_data: true
include_causal_channels: true
include_correlation_shift: true
